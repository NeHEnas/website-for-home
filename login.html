<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход</title>

<style>
*{margin: 0; padding: 0; box-sizing: border-box;}
body { background-image: url(background.png); min-height: 100vh; display: grid; place-items: center;}
.auth-card {padding: 36px; width: 480px; border-radius: 10px; background-color: #3a3c3f92; border: 1px solid #c9c4c4; color: #c9c4c4;}
h1{text-align: center; font-size: 36px; margin-bottom: 24px;}   
form{display: grid; gap: 12px;}
button{width: 100%; padding: 12px 16px; border-radius: 10px; color: #c9c4c4; background-color:#1262e3; margin-top: 8px; }
input{width: 100%; background-color: #c9c4c4; border: 1px solid #c9c4c4;}
</style>
</head>

<body>
<div class="auth-card">
    <h1> Авторизация </h1>  
    
    <form id="loginForm">

    <label for="username"> Логин:  </label>
    <input type="text" id="username" name="username" required>
    <label for="password">Пароль:</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Войти</button>

</form>
</div>
</body>

</html>
